<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initialscale=1.0">
<title>After School Subjects</title>
</head>
<body>
<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

<div id="mydiv">
<h1 class="introtitle">{{message}}</h1>
<center>
<p>{{ message2 }}</p>
</center>
<br>
<h1>{{ Subject1 }}</h1>
<img :src="image" alt="Maths" class = "maths-size">
<h4>{{ description1 }}</h4>
<h4>{{ description2 }}</h4>
<h4>The price is: £{{ price1 }}</h4>
<br>
</div>

<div id="mydiv2">
<h1>{{ Subject2 }}</h1>

</div>

<script type="module">
    const {createApp} = Vue
    const myApp = createApp({

        data() {
        return {
        message: 'Hello, (Name)',
        message2: "Here is the list of all our school subjects avaliable",
        Subject1: "Subject 1: Maths",
        description1: "Purchase maths if your child is interested into the study of numbers and symbols",
        description2: "Mathematics is the language in which God has written the universe",
        price1: 200,
        image: 'School Images/Maths.png',
        }
        }
        })
        myApp.mount('#mydiv')
</script>

<style>
    body {
        background-color: #02ff9e;
    }

    .introtitle{
        text-align: center;
    }

    .maths-size{
        width:250px;
        height:250px;
    }
</style>

</body>
</html>

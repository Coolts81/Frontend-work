<title>After School Subjects</title>

<body>
<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

<div id="mydiv">
<h1 class="introtitle">{{message}}</h1>
<center>
<p>{{ message2 }}</p>
<p>{{ CartMessage }}</p>
</center>

<button class = "ButtonCheckoutDesign" @click="toggleCheckout" :disabled="numberOfItems === 0" >
    <i class="fa fa-shopping-cart" aria-hidden="true"></i> Checkout ({{numberOfItems}})
</button>

<template v-if="!displayCart">
<div v-for="subject in SchoolSubjects"
    :id = "'groove' + subject.id"
    :class = "'Subject' + subject.id">
    <h1>{{subject.name}}</h1>
    <img :class="'Image' + subject.id" v-bind:src="subject.image">
    <h4>{{subject.description}}</h4>
    <h4>{{subject.description2}}</h4>
    <h4>Location: {{subject.Location}}</h4>
    <h4>Price: £{{subject.price}}</h4>
    <h4> Avaliability: {{subject.avaliability}}</h4>
    <button class = "CartButtonDesign" v-on:click="addToCart(subject)" v-bind:disabled="!canAddToCart(subject)">Add to Cart</button>
</div>
</template>

<div id = "app" v-else>

    <center>
    <p>First name: <input v-model="firstname"></p>
    <p>Last name: <input v-model="lastname"></p>
    <p>Phone number: <input v-model="phonenumber"></p>
    <center>

    <button :disabled = "CheckoutButtonDisabled" class = "CheckoutButtonSubmit"> Checkout Submit </button>

    
    <h1>Checkout Page for Subject Lessons</h1>
    
    <h1>Order items - Name</h1>
    <h1>Order items - Phone number</h1>

    <button class = "BackButton" @click="goback"> Back
        
    </button>

</div>

</div>

                    Location: "Hendon, United Kingdom",
                    price: 100,
                    image: 'School Images/Religious Studies.png',
                    avaliability: 5,
                },
                {
                    id: 9,
                    name: "Subject 9: Design and Technology",
                    description: "Design and Technology (DT) is about designing, creating and developing practical products using creativity, technical knowledge, materials and problem-solving skills to meet everyday needs.",
                    price: 100,
                    image: 'School Images/.png',
                    avaliability: 5,
                },
                {
                    id: 10,
                    name: "Subject 10: Design and Technology",
                    description: "Physical Education (PE) is about developing physical fitness, learning sports skills and understanding the importance of exercise, teamwork and a healthy lifestyle",
                    price: 100,
                    image: 'School Images/.png',
                    avaliability: 5,
                },
        ]
        }
        },

        computed: {
            canAddToCart(subject) {
                return (subject) => subject.avaliability > 0;
            },
            numberOfItems:function(){
                return this.cart.length;
            },
            CheckoutButtonDisabled(){
                return !this.firstname || !this.lastname || !this.phonenumber;
            },
            fullname(){
                return this.firstname + " " + this.lastname;
            },
            phonenumber(){
                return this.phonenumber;
            }
        },

        methods: {
            goback(){
                this.displayCart = false;
            },

            toggleCheckout() {
                this.displayCart = !this.displayCart;
            },

            addToCart(subject) {
                if (subject.avaliability > 0){
                    this.cart.push(subject.id);
                    subject.avaliability--;
                }
            }
        }
        })
        myApp.mount('#mydiv')

</script>
